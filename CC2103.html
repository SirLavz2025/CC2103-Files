<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC2103_DSA Reviewer</title>
  <style>
    :root {
      --ios-bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #311042 70%, #020617 100%);
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-highlight: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), 0 18px 36px -18px rgba(0, 0, 0, 0.7);
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. CSS-based selection and drag prevention */
    body {
      min-height: 100vh;
      background: var(--ios-bg-gradient);
      background-size: 200% 200%;
      animation: ambientGlow 15s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 20px;
      overflow-x: hidden;
      
      /* Security selection blocks */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      transition: filter 0.2s ease;
    }

    /* Hide content entirely when printing */
    @media print {
      body {
        display: none !important;
      }
    }

    @keyframes ambientGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(56, 189, 248, 0.15); top: 10%; left: 15%; }
    .orb-2 { width: 350px; height: 350px; background: rgba(168, 85, 247, 0.15); bottom: 10%; right: 15%; }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--glass-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .top-bar h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-pill {
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--accent-blue);
    }

    .card-stage {
      width: 100%;
      height: 380px;
      perspective: 1200px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 32px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
    }

    .card-face::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, var(--glass-highlight) 0%, rgba(255,255,255,0) 100%);
      border-radius: 32px 32px 0 0;
      opacity: 0.15;
      pointer-events: none;
    }

    .card-face::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.05), rgba(56, 189, 248, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(255, 255, 255, 0.07);
    }

    .card-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
    }

    .word {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      line-height: 1.2;
    }

    .clue {
      font-size: 17px;
      line-height: 1.5;
      color: var(--text-main);
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.7;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      justify-content: center;
    }

    .glass-btn {
      background: var(--glass-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      flex: 1;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .glass-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .glass-btn.shuffle {
      flex: 0 0 auto;
      padding: 14px;
      border-radius: 50%;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="app-container">
    <div class="top-bar">
      <h1>CC 2103 Reviewer Part 1 Exam</h1>
      <span class="progress-pill" id="counter">1 / 50</span>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <div class="card-stage">
      <div class="card" id="card">
        <div class="card-face card-front">
          <span class="card-tag">Question / Clue</span>
          <div class="card-content">
            <p class="clue" id="clue-text">Loading clue...</p>
          </div>
          <div class="hint-text">
            <svg class="hint-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm-1-5h2v2h-2zm1-11a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z"/></svg>
            Tap to reveal term
          </div>
        </div>

        <div class="card-face card-back">
          <span class="card-tag">Answer Term</span>
          <div class="card-content">
            <h2 class="word" id="word-text">WORD</h2>
          </div>
          <div class="hint-text">
            <svg class="hint-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm-1-5h2v2h-2zm1-11a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z"/></svg>
            Tap to see clue
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="glass-btn" id="prev-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Prev
      </button>
      
      <button class="glass-btn shuffle" id="shuffle-btn" title="Reshuffle Deck">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      </button>

      <button class="glass-btn" id="next-btn">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>

  <script>
    /* ===================================================
       1. FLASHCARD REVIEWER LOGIC
       =================================================== */
    const rawFlashcards = [
      { word: "PRIMITIVE", clue: "Category of basic data types including integers, characters, and Booleans." },
      { word: "FINITENESS", clue: "Algorithm property meaning execution eventually terminates." },
      { word: "BIGO", clue: "Notation describing an upper-bound growth rate." },
      { word: "SPACECOMPLEXITY", clue: "Amount of memory space required by the algorithm, during the course of its execution." },
      { word: "TIMECOMPLEXITY", clue: "Way to represent the amount of time required by the program to run till its completion" },
      { word: "NONPRIMITIVE", clue: "Complex data structures constructed from basic primitive types." },
      { word: "ARRAY", clue: "Data structure declared by int[] scores in Java." },
      { word: "INDEX", clue: "Numeric position used to access array elements." },
      { word: "DIMENSION", clue: "Structural layout axis of an array (e.g., 1D vs 2D)." },
      { word: "DIRECTINDEXING", clue: "Benefit enabling constant time access to array elements." },
      { word: "TRAVERSAL", clue: "Operation that processes every value in a structure." },
      { word: "UPDATE", clue: "Replaces one array value without moving other items." },
      { word: "DELETION", clue: "Operation that removes an element from a data structure." },
      { word: "SEARCHKEY", clue: "Value used to locate a particular record." },
      { word: "LINEARSEARCH", clue: "Sequential search method examining matches one by one." },
      { word: "BINARYSEARCH", clue: "Divides a sorted interval into two portions repeatedly." },
      { word: "INTERPOLATIONSEARCH", clue: "Estimates target search position using data values." },
      { word: "EXPONENTIALSEARCH", clue: "Expands range by powers before applying binary search." },
      { word: "TERNARYSEARCH", clue: "Technique dividing search space into three portions." },
      { word: "JUMPSEARCH", clue: "Skips fixed block sizes, then searches sequentially." },
      { word: "DIVIDEANDCONQUER", clue: "Principle checking middle value and discarding half." },
      { word: "SORTING", clue: "Arranging data according to a specified order." },
      { word: "BUBBLESORT", clue: "Sorting algorithm comparing neighboring elements." },
      { word: "SELECTIONSORT", clue: "Repeatedly chooses smallest element from unsorted portion." },
      { word: "INSERTIONSORT", clue: "Builds sorted portion by placing each item properly." },
      { word: "PIVOT", clue: "Element dividing data into partitions in Quick Sort." },
      { word: "MERGESORT", clue: "Divides data and combines sorted sections recursively." },
      { word: "QUICKSORT", clue: "Improves performance through thoughtful pivot selection." },
      { word: "RECURSION", clue: "Self-referential processing style used in divide-and-conquer." },
      { word: "PARTITION", clue: "Sub-division of an array created around a pivot point." },
      { word: "COMPARISON", clue: "Basic operation checking order between two keys." },
      { word: "SWAP", clue: "Exchanging memory positions of two elements." },
      { word: "UPPERBOUND", clue: "Mathematical ceiling of an algorithm's growth rate." },
      { word: "LOWERBOUND", clue: "Mathematical floor of an algorithm's growth rate." },
      { word: "QUADRATIC", clue: "Growth rate multiplier when input size doubles (4x)." },
      { word: "LINEAR", clue: "Growth complexity represented by O(n)." },
      { word: "LOGARITHMIC", clue: "Growth complexity represented by O(log n)." },
      { word: "CONSTANT", clue: "Execution complexity represented by O(1)." },
      { word: "ZEROBASED", clue: "Indexing scheme where first element is position 0." },
      { word: "MATRIX", clue: "Two-dimensional grid representation of data." },
      { word: "NESTEDLOOP", clue: "Control structure used to iterate 2D arrays systematically." },
      { word: "DATASTRUCTURE", clue: "Way of collecting and organizing data." },
      { word: "ALGORITHM", clue: "Step-by-step procedure for solving a problem." },
      { word: "BLOCKSIZE", clue: "Skipping interval used in jump search." },
      { word: "ORDERED", clue: "Prerequisite data collection state for binary search." },
      { word: "UNORDERED", clue: "Collection state where linear search is primary." },
      { word: "RETURNVALUE", clue: "Output signal indicating found position or negative status." },
      { word: "OPTIMIZATION", clue: "Improving code performance for memory or speed." },
      { word: "PASS", clue: "Complete single traversal over a dataset during sorting." },
      { word: "BIGTHETA", clue: "Asymptotic notation describing tight-bound complexity." }
    ];

    let flashcards = [];
    let currentIndex = 0;

    const cardEl = document.getElementById('card');
    const wordText = document.getElementById('word-text');
    const clueText = document.getElementById('clue-text');
    const counterEl = document.getElementById('counter');
    const progressFill = document.getElementById('progress-fill');

    function shuffleDeck() {
      flashcards = [...rawFlashcards];
      for (let i = flashcards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
      }
      currentIndex = 0;
    }

    function updateCard() {
      cardEl.classList.remove('flipped');
      
      setTimeout(() => {
        const item = flashcards[currentIndex];
        wordText.textContent = item.word;
        clueText.textContent = item.clue;
        counterEl.textContent = `${currentIndex + 1} / ${flashcards.length}`;
        progressFill.style.width = `${((currentIndex + 1) / flashcards.length) * 100}%`;
      }, 150);
    }

    cardEl.addEventListener('click', () => {
      cardEl.classList.toggle('flipped');
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        updateCard();
      }
    });

    document.getElementById('shuffle-btn').addEventListener('click', () => {
      shuffleDeck();
      updateCard();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        cardEl.classList.toggle('flipped');
      } else if (e.key === 'ArrowRight' && currentIndex < flashcards.length - 1) {
        currentIndex++;
        updateCard();
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    // Initialize reviewer
    shuffleDeck();
    updateCard();


    /* ===================================================
       2. CLIENT-SIDE SECURITY RESTRICTIONS
       =================================================== */

    // Disable Right-Click Context Menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Prevent Copy, Cut, Paste, Drag & Drop
    ['copy', 'cut', 'paste', 'dragstart', 'drop'].forEach((eventType) => {
      document.addEventListener(eventType, (e) => {
        e.preventDefault();
      });
    });

    // Block Key Combinations (Inspect Element, Save, Print, View Source, Select All)
    document.addEventListener('keydown', (e) => {
      // Block F12
      if (e.key === 'F12') {
        e.preventDefault();
        return false;
      }

      // Block Ctrl+Shift+I, J, C (DevTools)
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
        e.preventDefault();
        return false;
      }

      // Block Cmd+Option+I, J, C (Mac DevTools)
      if (e.metaKey && e.altKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
        e.preventDefault();
        return false;
      }

      // Block Ctrl/Cmd + U (View Source)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
      }

      // Block Ctrl/Cmd + S (Save Page)
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        return false;
      }

      // Block Ctrl/Cmd + P (Print)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        return false;
      }

      // Block Ctrl/Cmd + A (Select All)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
        return false;
      }

      // Attempt to clear clipboard if PrintScreen is pressed
      if (e.key === 'PrintScreen') {
        navigator.clipboard.writeText('');
      }
    });

    // Blur window when focus is lost (mitigates basic external screenshot overlays)
    window.addEventListener('blur', () => {
      document.body.style.filter = 'blur(12px)';
    });

    window.addEventListener('focus', () => {
      document.body.style.filter = 'none';
    });
  </script>
  <footer>@SirLavz2026 | RONALD T. LAVA, MSIT | Laguna University | College of Computing Studies
</body>
</html>
